name: Deploy mainland production

# This is deliberately separate from CI. A push to main runs the normal test
# suite first; this job deploys only after the checks finish successfully.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mainland-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: mainland-production
    steps:
      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MAINLAND_DEPLOY_SSH_KEY }}

      - name: Trust the mainland server host key
        env:
          DEPLOY_HOST: ${{ secrets.MAINLAND_DEPLOY_HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy the tested commit
        env:
          DEPLOY_HOST: ${{ secrets.MAINLAND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAINLAND_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          ssh "$DEPLOY_USER@$DEPLOY_HOST"
          "/opt/laixue/app/scripts/deploy-mainland.sh $DEPLOY_SHA"
