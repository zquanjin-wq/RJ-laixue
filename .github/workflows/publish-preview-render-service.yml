name: publish-preview-render-service

on:
  push:
    branches:
      - ci/video-export-preview-image
    paths:
      - .github/workflows/publish-preview-render-service.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zquanjin-wq/openmaic-render-service:v0.3.2-preview

jobs:
  build-publish-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch OpenMAIC render-service v0.3.2
        run: git clone --depth 1 --branch v0.3.2 https://github.com/THU-MAIC/OpenMAIC.git /tmp/openmaic

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Preview image
        run: |
          docker build --tag "$IMAGE_NAME" /tmp/openmaic/render-service
          docker push "$IMAGE_NAME"

      - name: Start the published image
        run: |
          docker image rm "$IMAGE_NAME"
          docker pull "$IMAGE_NAME"
          docker run -d --name render-service \
            -e RENDER_EGRESS_LOCKDOWN=false \
            -e RENDER_RESOURCE_PROFILE=low-memory \
            -p 127.0.0.1:9000:9000 \
            "$IMAGE_NAME"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && exit 0
            sleep 2
          done
          docker logs render-service
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f render-service || true
