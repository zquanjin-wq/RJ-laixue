name: video-export-s3-two-page

# Unmerged pull-request proof only: compile the fixed local fixture and render
# it on the runner's loopback address. Page two includes a local SVG so its
# uploaded screenshot can be visually inspected. No secrets, deployments, or app APIs.
on:
  pull_request:
    paths:
      - 'scripts/video-mini-compiler/**'
      - 'tests/video-mini-compiler/**'
      - '.github/workflows/video-export-s3-two-page.yml'

permissions:
  contents: read

jobs:
  render-two-page-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install compiler dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile the fixed two-page ZIP
        run: pnpm exec tsx scripts/video-mini-compiler/write-fixture.ts /tmp/two-page-course.zip

      - name: Check the local ZIP contract
        run: pnpm exec vitest run tests/video-mini-compiler/zip-contract.test.ts

      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Fetch upstream render-service
        run: git clone --depth 1 --branch v0.3.2 https://github.com/THU-MAIC/OpenMAIC.git /tmp/openmaic

      - name: Build and start render-service
        run: |
          docker build -t openmaic-render-service /tmp/openmaic/render-service
          docker run -d --name render-service \
            -e RENDER_EGRESS_LOCKDOWN=false \
            -e RENDER_RESOURCE_PROFILE=low-memory \
            -p 127.0.0.1:9000:9000 \
            openmaic-render-service
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && exit 0
            sleep 2
          done
          docker logs render-service
          exit 1

      - name: Render the local ZIP
        run: |
          JOB=$(curl -sf -F 'project=@/tmp/two-page-course.zip;type=application/zip' \
            -F fps=24 -F quality=draft -F format=mp4 http://127.0.0.1:9000/render)
          echo "$JOB" > /tmp/job.json
          JOB_ID=$(echo "$JOB" | jq -r .jobId)
          for i in $(seq 1 90); do
            STATUS=$(curl -sf "http://127.0.0.1:9000/render/$JOB_ID")
            echo "$STATUS"
            STATE=$(echo "$STATUS" | jq -r .status)
            [ "$STATE" = succeeded ] && break
            [ "$STATE" = failed ] && exit 1
            sleep 2
          done
          [ "$STATE" = succeeded ]
          echo "$STATUS" > /tmp/render-status.json
          curl -sf "http://127.0.0.1:9000/render/$JOB_ID/download" -o /tmp/two-page-course.mp4

      - name: Inspect video and two-page switch
        run: |
          ffprobe -v error -show_format -show_streams -of json /tmp/two-page-course.mp4 > /tmp/ffprobe.json
          jq -e 'any(.streams[]; .codec_type == "video" and .codec_name == "h264" and .width == 1280 and .height == 720)' /tmp/ffprobe.json
          jq -e '.format.duration | tonumber >= 5.5 and tonumber <= 6.5' /tmp/ffprobe.json
          ffmpeg -y -v error -ss 1 -i /tmp/two-page-course.mp4 -frames:v 1 /tmp/page-one.png
          ffmpeg -y -v error -ss 4 -i /tmp/two-page-course.mp4 -frames:v 1 /tmp/page-two.png
          test -s /tmp/page-one.png
          test -s /tmp/page-two.png
          if cmp -s /tmp/page-one.png /tmp/page-two.png; then
            echo 'Expected the two pages to render differently'
            exit 1
          fi

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-export-s3-two-page-proof
          retention-days: 1
          path: |
            /tmp/two-page-course.zip
            /tmp/two-page-course.mp4
            /tmp/job.json
            /tmp/render-status.json
            /tmp/ffprobe.json
            /tmp/page-one.png
            /tmp/page-two.png

      - name: Cleanup
        if: always()
        run: docker rm -f render-service || true
