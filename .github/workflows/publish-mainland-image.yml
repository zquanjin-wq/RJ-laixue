name: Publish mainland production image

# The Beijing host deliberately does not fetch from GitHub. After CI passes,
# this workflow builds the exact tested commit and publishes it to Tencent TCR.
on:
  # First mainland verification: publish the migration branch without merging it
  # into Vercel's production branch.
  push:
    branches: [migration/edgeone-m1]
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - app/**
      - components/**
      - lib/**
      - public/**
      - next.config.*
      - .github/workflows/publish-mainland-image.yml
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mainland-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: mainland-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ccr.ccs.tencentyun.com/laixue-ruijie/web:${{ github.event.workflow_run.head_sha || github.sha }}
            ccr.ccs.tencentyun.com/laixue-ruijie/web:main
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.DEPLOY_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.DEPLOY_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_RUNTIME_SHADOW=${{ secrets.DEPLOY_NEXT_PUBLIC_RUNTIME_SHADOW }}
            NEXT_PUBLIC_RUNTIME_SHADOW_PLAYBACK=${{ secrets.DEPLOY_NEXT_PUBLIC_RUNTIME_SHADOW_PLAYBACK }}
            NEXT_PUBLIC_DOCUMENT_STORE_BRIDGE=${{ secrets.DEPLOY_NEXT_PUBLIC_DOCUMENT_STORE_BRIDGE }}
            NEXT_PUBLIC_DOCUMENT_STORE_PARITY_CHECK=${{ secrets.DEPLOY_NEXT_PUBLIC_DOCUMENT_STORE_PARITY_CHECK }}
            NEXT_PUBLIC_MAIC_EDITOR_ENABLED=${{ secrets.DEPLOY_NEXT_PUBLIC_MAIC_EDITOR_ENABLED }}
