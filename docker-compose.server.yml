# Mainland server runtime. It never builds from source and never contacts GitHub.
services:
  laixue:
    image: ${LAIXUE_IMAGE:?set by reconcile-mainland-image.sh}
    env_file:
      - .env.deploy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - laixue-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      laixue:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAIXUE_DOMAIN: ${LAIXUE_DOMAIN:?set in .env.deploy}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  laixue-data:
  caddy-data:
  caddy-config:
