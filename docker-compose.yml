services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laixue
      POSTGRES_USER: laixue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laixue -d laixue']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_ENABLE_PPTX_IMPORT: ${NEXT_PUBLIC_ENABLE_PPTX_IMPORT:-false}
        NEXT_PUBLIC_ENABLE_DURABLE_GENERATION: ${NEXT_PUBLIC_ENABLE_DURABLE_GENERATION:-false}
        NEXT_PUBLIC_ENABLE_PPTX_AI_CLASSROOM: ${NEXT_PUBLIC_ENABLE_PPTX_AI_CLASSROOM:-false}
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://laixue:${POSTGRES_PASSWORD}@db:5432/laixue
      RENDER_SERVICE_URL: http://render-service:9000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    networks:
      - default
      - render
    restart: unless-stopped

  revoice-worker:
    build: .
    env_file:
      - .env.production
    environment:
      COURSE_REVOICE_URL: http://app:3000/api/cron/course-revoice
      COURSE_REVOICE_INTERVAL_MS: '60000'
    depends_on:
      - app
    command: ['node', 'scripts/run-course-revoice-worker.mjs']
    restart: unless-stopped

  classroom-generation-worker:
    build: .
    env_file:
      - .env.production
    environment:
      CLASSROOM_GENERATION_WORKER_URL: http://app:3000/api/cron/classroom-generation
      CLASSROOM_GENERATION_INTERVAL_MS: '3000'
    depends_on:
      - app
    command: ['node', 'scripts/run-classroom-generation-worker.mjs']
    restart: unless-stopped

  render-service:
    build: ./render-service
    profiles: ['video-export']
    expose:
      - '9000'
    cap_add:
      - NET_ADMIN
    environment:
      PORT: '9000'
      RENDER_MAX_CONCURRENCY: '1'
      RENDER_MAX_CONCURRENT_EXTRACTIONS: '1'
      RENDER_MAX_JOBS_PER_USER: '0'
      RENDER_JOB_DEADLINE_MS: '5400000'
    mem_limit: 4g
    networks:
      - render
    restart: unless-stopped

  video-export-worker:
    build:
      context: .
      target: tools
    profiles: ['video-export']
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://laixue:${POSTGRES_PASSWORD}@db:5432/laixue
      RENDER_SERVICE_URL: http://render-service:9000
      COURSE_VIDEO_EXPORT_INTERVAL_MS: '5000'
      COURSE_VIDEO_EXPORT_LEASE_MS: '300000'
      COURSE_VIDEO_EXPORT_WORKER_ID: primary-video-agent
    depends_on:
      db:
        condition: service_healthy
      render-service:
        condition: service_started
    command: ['pnpm', 'exec', 'tsx', 'scripts/run-course-video-export-agent.ts']
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  migrate:
    build: .
    profiles: ['tools']
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://laixue:${POSTGRES_PASSWORD}@db:5432/laixue
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'scripts/migrate-database.mjs']

  bootstrap-admin:
    build:
      context: .
      target: tools
    profiles: ['tools']
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://laixue:${POSTGRES_PASSWORD}@db:5432/laixue
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['node', 'scripts/bootstrap-admin.mjs']

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:

networks:
  render:
    internal: true
